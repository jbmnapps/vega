<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MyCat — Vega</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #eceae5; font-family: Inter, -apple-system, system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0.9; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  /* scrollbar hygiene */
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/tokens.jsx"></script>
<script type="text/babel" src="src/ui.jsx"></script>
<script type="text/babel" src="src/state.jsx"></script>
<script type="text/babel" src="src/tab-bar.jsx"></script>
<script type="text/babel" src="src/ios-frame.jsx"></script>
<script type="text/babel" src="src/screen-idag-c.jsx"></script>
<script type="text/babel" src="src/screen-foder.jsx"></script>
<script type="text/babel" src="src/screen-foder-log.jsx"></script>
<script type="text/babel" src="src/screen-vaegt.jsx"></script>
<script type="text/babel" src="src/screen-obs-tid.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>

<script type="text/babel" data-presets="react">
  function Root() {
    // Responsive scale: fit to viewport with iPhone frame
    const FRAME_W = 402, FRAME_H = 874;
    const [scale, setScale] = React.useState(1);
    React.useEffect(() => {
      const calc = () => {
        const availW = window.innerWidth - 48;
        const availH = window.innerHeight - 48;
        setScale(Math.min(1, availW / FRAME_W, availH / FRAME_H));
      };
      calc();
      window.addEventListener('resize', calc);
      return () => window.removeEventListener('resize', calc);
    }, []);

    return (
      <div data-screen-label="MyCat" style={{
        width: FRAME_W * scale, height: FRAME_H * scale,
        position: 'relative',
      }}>
        <div style={{
          width: FRAME_W, height: FRAME_H,
          transform: `scale(${scale})`, transformOrigin: 'top left',
          position: 'absolute', top: 0, left: 0,
        }}>
          <IOSDevice width={FRAME_W} height={FRAME_H}>
            <div style={{ width: '100%', height: '100%', background: TOKENS.bg }}>
              <App />
            </div>
          </IOSDevice>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
